name: notes-chat-app

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: notes-chat-app:dev

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: notes_project.settings
  SECRET_KEY: ${SECRET_KEY:-django-insecure-notes-chat-dev-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DATABASE_URL: postgres://${POSTGRES_USER:-notes_user}:${POSTGRES_PASSWORD:-notes_pass}@db:5432/${POSTGRES_DB:-notes_db}
  REDIS_URL: redis://redis:6379/0
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@notes.local}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-25}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-0}
  NGROK_DOMAIN: ${NGROK_DOMAIN:-}

x-app-volumes: &app-volumes
  - .:/app
  # Named volume shadows ./staticfiles from the bind mount.
  # Web runs collectstatic here, nginx serves the same volume read-only.
  - staticfiles:/app/staticfiles

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes_db}
      POSTGRES_USER: ${POSTGRES_USER:-notes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app-net

  web:
    <<: *app-build
    restart: unless-stopped
    command: ["sh", "./entrypoint.sh"]
    ports:
      # Direct development access and local Selenium debugging.
      # Production traffic should normally go through nginx on port 80.
      - "${WEB_PORT:-8001}:8001"
    volumes: *app-volumes
    environment:
      <<: *app-environment
      PORT: 8001
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-1}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      SEED_DEMO_RESET: ${SEED_DEMO_RESET:-0}
      CREATE_SUPERUSER: ${CREATE_SUPERUSER:-0}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}
      UVICORN_RELOAD: ${UVICORN_RELOAD:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/accounts/login/', timeout=5)\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/accounts/login/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app-net

  celery-worker:
    <<: *app-build
    restart: unless-stopped
    command: ["celery", "-A", "notes_project", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    volumes: *app-volumes
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A notes_project inspect ping -d celery@$${HOSTNAME} >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - app-net

  celery-beat:
    <<: *app-build
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "notes_project",
        "beat",
        "--loglevel=info",
        "--schedule=/app/celerybeat/celerybeat-schedule",
      ]
    volumes:
      - .:/app
      - celerybeat_data:/app/celerybeat
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  selenium:
    image: selenium/standalone-chrome:latest
    profiles: ["test"]
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "${SELENIUM_PORT:-4444}:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4444/wd/hub/status || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    networks:
      - app-net

  selenium-tests:
    <<: *app-build
    profiles: ["test"]
    command: ["python", "manage.py", "test", "notes_app.tests.test_selenium", "-v", "2"]
    volumes: *app-volumes
    environment:
      <<: *app-environment
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      # LiveServer tests run inside this container, so Selenium must call this service name.
      WEB_HOST: selenium-tests
      # External smoke tests call the already running Docker stack through nginx.
      SELENIUM_EXTERNAL_BASE_URL: http://nginx
      SELENIUM_EXTERNAL_USERNAME: ${SELENIUM_EXTERNAL_USERNAME:-demo_alice}
      SELENIUM_EXTERNAL_PASSWORD: ${SELENIUM_EXTERNAL_PASSWORD:-demo1234}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      nginx:
        condition: service_healthy
      selenium:
        condition: service_healthy
    networks:
      - app-net

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: http --url=${NGROK_DOMAIN:-} nginx:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "${NGROK_UI_PORT:-4040}:4040"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  celerybeat_data:

networks:
  app-net:
    driver: bridge
