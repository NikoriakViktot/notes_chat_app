services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  web:
    build: .
    # Port 8001 exposed directly for dev access and Selenium tests.
    # In production, remove this and access only through nginx on port 80.
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      # Named volume at /app/staticfiles shadows the bind-mount subdirectory
      # so collectstatic writes here and nginx can read the same volume.
      - staticfiles:/app/staticfiles
    environment:
      DATABASE_URL: postgres://notes_user:notes_pass@db:5432/notes_db
      REDIS_URL: redis://redis:6379/0
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      WEB_HOST: web
      SEED_DEMO_DATA: "1"
      NGROK_DOMAIN: ${NGROK_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/accounts/login/')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/accounts/login/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  ngrok:
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_DOMAIN} nginx:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app-net

  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/wd/hub/status || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - app-net

volumes:
  postgres_data:
  staticfiles:

networks:
  app-net:
    driver: bridge
