# GitHub Actions CI — Django Tests (notes_chat_app)

# ЯК ПЕРЕГЛЯНУТИ РЕЗУЛЬТАТИ:
#   https://github.com/NikoriakViktot/PY-Course-Victor-Nikoriak-23_02/actions

name: Django Tests

# ── Тригери ───────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]
    paths:
      - 'notes_app/**'
      - 'notes_project/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - '.github/workflows/django-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'notes_app/**'
      - 'notes_project/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - '.github/workflows/django-tests.yml'
  workflow_dispatch:   # кнопка "Run workflow" в GitHub UI → Actions

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Unit + Integration + WebSocket Consumer тести (~30 секунд) ─────────
  #
  # Що тестується:
  #   test_models    — ORM моделі, валідатори, defaults
  #   test_services  — бізнес-логіка (create/update/delete)
  #   test_forms     — валідація форм, security filtering
  #   test_views     — HTTP views, access control, redirect ланцюги
  #   test_consumers — WebSocket Consumer (WebsocketCommunicator, без браузера)
  #
  # Сервіси не потрібні:
  #   БД     → SQLite (DATABASE_URL не встановлено → settings.py бере SQLite)
  #   Channels → InMemoryChannelLayer (REDIS_URL не встановлено → settings.py бере InMemory)
  unit-and-integration:
    name: Unit, Integration & Consumer Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Завантажити репозиторій
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановити Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Кешувати pip залежності
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Встановити залежності
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Перевірити конфігурацію Django
      - name: Django system check
        run: python manage.py check

      # 6. Запустити unit + integration + consumer тести
      - name: Run unit, integration and consumer tests
        run: |
          python manage.py test \
            notes_app.tests.test_models \
            notes_app.tests.test_services \
            notes_app.tests.test_forms \
            notes_app.tests.test_views \
            notes_app.tests.test_consumers \
            -v 2

      # 7. Генерувати coverage report
      - name: Generate coverage report
        run: |
          coverage run manage.py test \
            notes_app.tests.test_models \
            notes_app.tests.test_services \
            notes_app.tests.test_forms \
            notes_app.tests.test_views \
            notes_app.tests.test_consumers
          coverage report --show-missing
          coverage xml -o coverage.xml

      # 8. Зберегти coverage.xml як artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml


  # ── Job 2: Selenium E2E тести ────────────────────────────────────────────────
  #
  # Що тестується:
  #   test_selenium — реальний браузер: login flow, note workflow, chat page,
  #                   WebSocket chat (ChannelsLiveServerTestCase → Daphne ASGI)
  #
  # ЧОМУ БЕЗ service container для Selenium:
  #   selenium/standalone-chrome бачить свій власний localhost, а не runner.
  #   Рішення: використовуємо Chrome що вже є на ubuntu-latest.
  #   SELENIUM_REMOTE_URL не встановлено → _make_headless_driver() бере
  #   локальний headless Chrome; Selenium Manager завантажує потрібний chromedriver.
  #
  # ChannelsLiveServerTestCase (SeleniumWebSocketChatTest):
  #   Запускає реальний Daphne ASGI сервер у окремому потоці.
  #   Потребує file-based test DB (не :memory:) — вже налаштовано в settings.py
  #   TEST.NAME = BASE_DIR / "test_db.sqlite3".
  selenium-e2e:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Без SELENIUM_REMOTE_URL → _make_headless_driver() → локальний headless Chrome
      # Chrome вже встановлений на ubuntu-latest; Selenium Manager скачає chromedriver
      - name: Run Selenium E2E tests
        run: python manage.py test notes_app.tests.test_selenium -v 2
