worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Map Upgrade header → Connection value.
    # Non-WS requests: "close". WebSocket requests: "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream django {
        server web:8001;
    }

    server {
        listen 80;

        # Serve static files directly — bypasses Django/uvicorn entirely.
        # /staticfiles/ is populated by `collectstatic` in entrypoint.sh.
        location /static/ {
            alias /staticfiles/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Proxy everything else (HTTP + WebSocket) to the uvicorn/Daphne backend.
        location / {
            proxy_pass http://django;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support (Django Channels).
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
