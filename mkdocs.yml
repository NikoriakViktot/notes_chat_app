site_name: Notes Chat App — Курс Django
site_description: Навчальний курс Django від основ до production-ready застосунку з WebSocket чатом
site_url: https://nikoriakviktor.github.io/notes_chat_app/
repo_url: https://github.com/NikoriakViktot/notes_chat_app
repo_name: NikoriakViktot/notes_chat_app
docs_dir: docs
site_dir: site

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: uk

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

